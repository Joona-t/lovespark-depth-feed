<style>

/* The four Korean themes, same tokens as Raw Thought reader and the Retro Cursor popup.
   scripts/verify-themes.mjs checks every text colour against every surface it can sit on. */
:root[data-theme="kr-seoul"] {
  --bg: #ffe8f2; --panel: #fdf9ff; --ink: #3a2a3a; --muted: #6b4a66; --line: #c4a8e0;

}
:root[data-theme="kr-gingham"] {

  --accent: #b0124f; --accent-ink: #ffffff; --chip: #ffe3ee;
  --page-bg: linear-gradient(#fff3f7, #fff3f7);
}
:root[data-theme="kr-holo"] {
  --bg: #efe4ff; --panel: #faf7ff; --ink: #2b1b4a; --muted: #54447a; --line: #e3d6f7;

  --page-bg: radial-gradient(60% 45% at 12% 8%, #ffd1ea 0%, transparent 70%), radial-gradient(55% 40% at 92% 18%, #cfe6ff 0%, transparent 70%), radial-gradient(60% 50% at 80% 88%, #c8f7e1 0%, transparent 72%), radial-gradient(55% 45% at 10% 80%, #ffd8c2 0%, transparent 70%), linear-gradient(#efe4ff, #efe4ff);
}
:root[data-theme="kr-neon"] {
  --bg: #120b18; --panel: #1e1030; --ink: #f3eaf2; --muted: #c9b3dc; --line: #4a2a5e;
  --accent: #ff46d6; --accent-ink: #120b18; --chip: #2a1740;
  --page-bg: radial-gradient(80% 50% at 50% -10%, #3e1a40 0%, transparent 70%), radial-gradient(70% 45% at 100% 110%, #3a0f50 0%, transparent 70%), linear-gradient(#120b18, #120b18);
  color-scheme: dark;
}
:root[data-theme^="kr-"] body { background-image: var(--page-bg); background-attachment: fixed; }
/* each theme's signature: Seoul's lilac offset shadow, Gingham's inked sticker card and top band, Holo's glass, Neon's glow */
:root[data-theme="kr-seoul"] .card { box-shadow: 3px 3px 0 #c4a8e0; }
:root[data-theme="kr-gingham"] .card { border: 2px solid #2a1824; box-shadow: 3px 3px 0 #2a1824; }
:root[data-theme="kr-gingham"] body::before { content: ""; position: fixed; inset: 0 0 auto 0; height: 10px; z-index: 20; pointer-events: none;
  background: repeating-linear-gradient(0deg, rgba(246, 166, 196, .6) 0 5px, transparent 5px 10px), repeating-linear-gradient(90deg, rgba(246, 166, 196, .6) 0 5px, transparent 5px 10px), #fff3f7; }

#theme { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 4px 10px; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }

main { max-width: 1100px; margin: 0 auto; padding: 8px 16px 48px; }

.chip[aria-pressed="true"] .meta { color: inherit; }
.note { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
input[type=search] { font: inherit; width: 100%; padding: 10px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); margin-bottom: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; }
.thumb { aspect-ratio: 16/9; background: var(--chip) center/cover; cursor: pointer; border: 0; padding: 0; width: 100%; display: block; }
.body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
.title { font-weight: 600; line-height: 1.3; cursor: pointer; }
.meta { color: var(--muted); font-size: 13px; }
.quote { font-size: 14px; color: var(--muted); border-left: 2px solid var(--line); padding-left: 10px; margin: 4px 0 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.actions { display: flex; gap: 6px; margin-top: auto; padding-top: 8px; }

.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }

#player { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; z-index: 10; overflow: auto; }
#player.open { display: flex; }
#player .wrap { max-width: 1100px; width: 100%; margin: 0 auto; padding: 16px; }
#player .frame { aspect-ratio: 16/9; width: 100%; background: #000; border-radius: 12px; overflow: hidden; }
#player iframe { width: 100%; height: 100%; border: 0; }

#player h2 { font-size: 18px; margin: 0; }
#player .quote { -webkit-line-clamp: unset; margin-top: 16px; }
a { color: var(--accent); }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.empty { color: var(--muted); padding: 40px 0; text-align: center; }

<script>
const VIDEOS = [{"id":"kCc8FmEb1nY","title":"Let's build GPT: from scratch, in code, spelled out.","ch":"Andrej Karpathy","hn":"Let's build GPT: from scratch, in code, spelled out by Andrej Karpathy [video]","rec":57,"pts":1112,"yrs":[2023,2026],"story":"34414716","q":{"t":"I kind of want to blanket recommend but that's not very helpful I would suggest starting with Andrej Karpathy's YouTube video: https://youtu.be/kCc8FmEb1nY?is=oiDsrBYJg_MUUmoD This video is excellent. I'm a huge fan. Also the video is zero commitment and instantly available which makes it a good way to check you are interested. The book by Sebastian Raschka is slightly less accessible but very reasonably priced and the experience of working through a book is a lot nicer than skipping back and forth in a video (for me). Sebastian's blog posts on recent architectures are absolutely great too.","by":"fancyfredbot","id":"49420346"},"tags":["LLMs","AI"],"learn":true,"s":77},{"id":"GVsUOuSjvcg","title":"Future Computers Will Be Radically Different (Analog Computing)","ch":"Veritasium","hn":"We're building computers wrong [video]","rec":34,"pts":97,"yrs":[2022,2026],"story":"30567432","q":{"t":"The company (Mythic AI) in the article was featured on a Veritasium video[1] about analog computing. The interesting part for analog is obviously going to be wear and repeatability, because the digital layer auto-corrects the errors until it becomes damaged and unusable clearly, while analog will slide off somewhat gracefully but you need a way to detect it happening multiple layers later. AI is somewhat tolerant of errors since, the cumulative error across a lot of biases can approach zero if the errors are random. [1] - https://www.youtube.com/watch?v=GVsUOuSjvcg#t=15m44s","by":"gopalv","id":"35382513"},"tags":["Physics"],"learn":true,"s":51.2},{"id":"zjkBMFhNj_g","title":"[1hr Talk] Intro to Large Language Models","ch":"Andrej Karpathy","hn":"Intro to Large Language Models [Video]","rec":32,"pts":291,"yrs":[2023,2026],"story":"38388669","q":{"t":"Seems like they have made progress in combining reinforcement learning and LLMs. Andrej Karpathy mentions it in his new talk (~38 minutes in) [1], and Ilya Sutskever talks about it in a lecture at MIT (~29 minutes in) [2]. It would be a huge breakthrough to find a proper reward function to train LLMs in a reinforcement learning setup, and to train a model to solve math problems in a similar fashion to how AlphaGo used self-play to learn Go. [1] https://www.youtube.com/watch?v=zjkBMFhNj_g&t=2282s [2] https://www.youtube.com/watch?v=9EN_HoEk3KY&t=1705s","by":"JacobJeppesen","id":"38390952"},"tags":["LLMs","AI"],"learn":true,"s":49.4},{"id":"7xTGNNLPyMI","title":"Deep Dive into LLMs like ChatGPT","ch":"Andrej Karpathy","hn":"Andrej Karpathy: Deep Dive into LLMs Like ChatGPT [video]","rec":31,"pts":582,"yrs":[2025,2026],"story":"42952960","q":{"t":"Since you're posting here, you're looking for the shortcut. The shortcut is Karpathy's \"Let's Build GPT: from scratch, in code, spelled out\" video: https://www.youtube.com/watch?v=kCc8FmEb1nY Then there is a good video that dives into LLMs and how they work that is quite approachable: https://www.youtube.com/watch?v=7xTGNNLPyMI From there, flesh out knowledge with his other videos, where he goes both extremely light and extremely deep: https://www.youtube.com/@AndrejKarpathy/videos Anyway, I really like's Karpathy's video because he's very good at explaining LLMs at every level.","by":"runjake","id":"45542438"},"tags":["LLMs","AI"],"learn":true,"s":45.7},{"id":"VMj-3S1tku0","title":"The spelled-out intro to neural networks and backpropagation: building micrograd","ch":"Andrej Karpathy","hn":"A spelled-out intro to neural networks and backpropagation [video]","rec":27,"pts":160,"yrs":[2022,2026],"story":"32491440","q":{"t":"> It takes years to become competent at the math needed for AI (Assuming that \"AI\" refers to large language models) The best open source LLM fits in less than 300 lines of code and consists mostly of matrix multiplications. https://github.com/meta-llama/llama3/blob/main/llama/model.p... Anyone with a basic grasp of linear algebra can probably learn to understand it in a week. Here is a video playlist by former Stanford professor and OpenAI employee Andrej Karpathy which should cover most of it (less than 16 hours total): https://www.youtube.com/watch?v=VMj-3S1tku0&list=PLAqhIrjkxb...","by":"johndough","id":"40401200"},"tags":["AI","LLMs"],"learn":true,"s":45.2},{"id":"wjZofJX0v4M","title":"Transformers, the tech behind LLMs | Deep Learning Chapter 5","ch":"3Blue1Brown","hn":"But what is a GPT?  Visual intro to Transformers [video]","rec":22,"pts":475,"yrs":[2024,2026],"story":"40003582","q":{"t":"This video explains the direction-encodes-trait topic very well IMO: https://youtu.be/wjZofJX0v4M It’s the first in a series of three that I can very highly recommend. > there's no way that there's a 1-to-1 correspondence between concepts and dimensions. I don’t know about that! Once you go very high dimensional, there is a lot of direction vectors that are almost perfectly perpendicular to each other (meaning they can cleanly encode a trait). Maybe they don’t even need to be perfectly perpendicular, the dot product just needs to be very close to zero.","by":"manmal","id":"43965713"},"tags":["LLMs","AI","Math"],"learn":true,"s":38.3},{"id":"IV3dnLzthDA","title":"The Man Who Accidentally Killed The Most People In History","ch":"Veritasium","hn":"A Man Who Accidentally Killed the Most People in History","rec":20,"pts":47,"yrs":[2022,2026],"story":"31200602","q":{"t":"The Man Who Accidentally Killed The Most People In History https://www.youtube.com/watch?v=IV3dnLzthDA > This, my dear friend, is all I can at present recollect on the Subject. You will see by it, that the Opinion of this mischievous Effect from Lead, is at least above Sixty Years old; and you will observe with Concern how long a useful Truth may be known, and exist, before it is generally receiv'd and practis'd on. > Benjamin Franklin, 1786","by":"dbg31415","id":"48874318"},"tags":["Physics"],"learn":true,"s":35.7},{"id":"AF8d72mA41M","title":"Why It Was Almost Impossible to Make the Blue LED","ch":"Veritasium","hn":"It was almost impossible to make the blue LED [video]","rec":19,"pts":482,"yrs":[2024,2026],"story":"39313339","q":{"t":"In real life, the inventor of the blue led was basically scammed by his company. The company earned a lot of money and basically shifted the whole business to produce blue leds. Veritasium recently made a video about that https://www.youtube.com/watch?v=AF8d72mA41M I think this illustrate another point: patents should protect inventors, not companies. Companies shouldn't be able to amass a \"portfolio\" of patents to bully their competition either.","by":"nextaccountic","id":"39764567"},"tags":["Physics"],"learn":true,"s":35.4},{"id":"mScpHTIi-kM","title":"Once you understand game theory, you understand the world.","ch":"Veritasium","hn":"What the Prisoner's Dilemma Reveals About Life [video]","rec":18,"pts":15,"yrs":[2023,2026],"story":"38841765","q":{"t":"The US is lying about tiktok, the only reason is to mirror China's strategy towards American app. After watching the tit-for-tat video of Veritasum[1] I agree with America's strategy of banning Chinese apps until China allows American apps. That being said, I wish the US was more transparent about why they're doing this instead of lying. I'm guessing the reason why they're lying is that they don't want to scare ALL Chinese companies. [1]: https://www.youtube.com/watch?v=mScpHTIi-kM","by":"baby","id":"43774540"},"tags":["Physics"],"learn":true,"s":29.5},{"id":"MiUHjLxm3V0","title":"The Closest Thing We Have to Alien Technology","ch":"Veritasium","hn":"Veritasium: The Ridiculous Engineering of ASML Machine [video]","rec":19,"pts":59,"yrs":[2025,2026],"story":"46470046","q":{"t":"I just watched the Vertasium video[1] on ASML's EUV lithgoraphy machines over the weekend, and I think the qualifier they used was \"most complex machine _you can purchase commercially_\". I can't remember if it was an ASML representative that said that, or if it was an overlaid asterisk that popped up on the screen at some point - but I definitely remember thinking about the space shuttle and Saturn V/Apollo and those sorts of things before I saw the qualifier. [1]: https://www.youtube.com/watch?v=MiUHjLxm3V0","by":"rufo","id":"47937745"},"tags":["Physics"],"learn":true,"s":29.2},{"id":"oI_X2cMHNe0","title":"How Electricity Actually Works","ch":"Veritasium","hn":"How Electricity Actually Works [video]","rec":14,"pts":30,"yrs":[2022,2026],"story":"31263764","q":{"t":"In response to all the controversy he made a follow up video [0]. In the video he recreated the experiment, explaining the effect in a more technically correct manner and also apologised for not doing so on the original. He also made it clear that the light globe in the original video did not receive enough current to light up.. it was hooked up to an alternative power source and an oscilloscope and upon receiving any signal above baseline would switch on the globe. [0] https://youtu.be/oI_X2cMHNe0?si=uprU-oZfk3ahKgx0","by":"antihipocrat","id":"38780801"},"tags":["Physics"],"learn":true,"s":28.9},{"id":"ZMQbHMgK2rw","title":"The Fastest Maze-Solving Competition On Earth","ch":"Veritasium","hn":"Micromouse: The fastest maze-solving competition [video]","rec":10,"pts":355,"yrs":[2023,2026],"story":"36087330","q":{"t":"For me it was the Veritasium Micromouse video[0]. Hard to quote the video but from wikipedia[1]:\"Micromice are among the highest-performing autonomous robots.\" Things like fans and ground effect being used to make these devices do 6g turns while mapping and solving a maze. Alternately, the world of quadcopters, face recognition (body warmth recognition required?), lidar will make for a terrifying battlefield. [0] https://www.youtube.com/watch?v=ZMQbHMgK2rw [1] ke for granted took a journey of several thousand years to be get invented. While I'm thinking about it, his recent video about the development of blue LEDs [2] is very interesting as well if you haven't seen it. [1] https://youtu.be/RQYuyHNLPTQ [2] https://youtu.be/AF8d72mA41M","by":"wernsey","id":"39741345"},"tags":["Physics"],"learn":true,"s":14.6},{"id":"YdOXS_9_P4U","title":"Terence Tao on the cosmic distance ladder","ch":"3Blue1Brown","hn":"Terence Tao on how we measure the cosmos – Distance ladder [video]","rec":5,"pts":40,"yrs":[2025,2026],"story":"43097533","q":{"t":"They do this mostly with spectroscopy, breaking out the light by frequency. The longer the light has been travelling, the more frequency shifts into redder frequencies, because the universe is continually expanding. But those distances are all built on top of the cosmic distance ladder (Terence Tao explaining on 3blue1brown) https://youtu.be/YdOXS_9_P4U?is=jbkFbwWKgbn3yOjq Maps like DESI add the 3d distances. https://www.desi.lbl.gov/education-outreach/interactive-visu...","by":"epistasis","id":"49394646"},"tags":["Math"],"learn":true,"s":14.4},{"id":"fRed0Xmc2Wg","title":"Oh, wait, actually the best Wordle opener is not “crane”…","ch":"3Blue1Brown","hn":"Oh, wait, the best Wordle opener is not “crane“","rec":5,"pts":14,"yrs":[2022,2026],"story":"30325151","q":{"t":"Reminds me of the 3Blue1Brown video about Wordle, and then it's followup video. I guess that's kind of a spoiler, but still worth a watch. https://www.youtube.com/watch?v=v68zYyaEmEA https://www.youtube.com/watch?v=fRed0Xmc2Wg","by":"bnycum","id":"37161709"},"tags":["Math"],"learn":true,"s":14.4},{"id":"QtxVdC7pBQM","title":"The Ridiculous Engineering Of Jet Engines","ch":"Veritasium","hn":"What happens if you throw sand into a jet engine? [video]","rec":8,"pts":8,"yrs":[2025,2026],"story":"46065818","q":{"t":"I know Veritasium gets posted here a lot, but a few days ago he posted a deep-dive into the the engineering of jet engine turbine blades. Turns out they're made from a single crystal of a superalloy that entangles itself at a molecular level such that it actually gains strength as it's heated, only losing strength above 1200 degrees C / 2200 degrees F. Below that temperature, as long as the strain on the part is below the plastic deformation threshold, it's not really losing any strength at all over time. https://www.youtube.com/watch?v=QtxVdC7pBQM","by":"hnuser123456","id":"46006235"},"tags":["Physics"],"learn":true,"s":14.4},{"id":"0xS68sl2D70","title":"Veritasium: What Everyone Gets Wrong About AI and Learning – Derek Muller Explains","ch":"Perimeter Institute for Theoretical Physics","hn":"Veritasium: How Will AI Change Education? [video]","rec":7,"pts":12,"yrs":[2025,2026],"story":"43671036","q":{"t":"Derek Muller from the Veritasium channel gave a great (and funny) talk[1] about how AI will not revolutionize education and I'll quote my favorite part: \"The world is full of heavy objects; yet not everyone is ripped\". Meaning that what fails with AI in education is also what fails in education without AI: lack of motivation that a good coach could provide. [1] https://www.youtube.com/watch?v=0xS68sl2D70","by":"teabee89","id":"48415838"},"tags":["AI","Physics"],"learn":true,"s":14.1},{"id":"tz23G_UXCGA","title":"Something is jamming GPS over Europe. Here's what we found","ch":"Veritasium","hn":"Something is jamming GPS over Europe","rec":7,"pts":33,"yrs":[2026,2026],"story":"48520070","q":{"t":"Things to think about: the russian satellites currently already in orbit and being tested to jam global GPS signals: https://youtu.be/tz23G_UXCGA?si=Jkg7hYnwER39-FXf (Veritasium). In all these sci-fi space datacentre scenarios, has anybody considered that astrolaw is in no way currently equipped to deal with datacenters in space? Neither are international relations.","by":"frm88","id":"48433436"},"tags":["Physics"],"learn":true,"s":14.1},{"id":"OOMx2BHHWtE","title":"One of the world's greatest outube.com/watch?v=Cz4Q4QOuoo8 The first video is really a tour de force. Too bad it saw such limited traction here: https://news.ycombinator.com/item?id=38482549","by":"jacobolus","id":"38597169"},"tags":["Math"],"learn":true,"s":5.4},{"id":"Phscjl0u6TI","title":"How the Bizarre Path of Mars Reshaped Astronomy [Kepler's Laws Part 1]","ch":"Welch Labs","hn":"Kepler's New Astronomy [video]","rec":2,"pts":1,"yrs":[2024,2025],"story":"41293891","q":{"t":"I agree, and if you want to learn more about him I highly recommend this two-part series: https://www.youtube.com/watch?v=Phscjl0u6TI What is particularly wild is that Kepler had to wait for Tycho Brahe to die to steal his data before Brahe's heirs got their hands on it. Not only that, but Kepler was very close to making epicycles work but he was not satisfied with the (relatively small) predictive errors. So, if not for Kepler's combination of...flexible morality and unsatified nature, physics as we know it would have been delayed or perhaps never discovered at all!","by":"simpaticoder","id":"43180113"},"tags":["AI","Math"],"learn":true,"s":5.4},{"id":"GlYgs6v2YfU","title":"But what is cross-entropy? | Compression is Intelligence Part 2","ch":"3Blue1Brown","hn":"But what is cross-entropy? – Compression is Intelligence Part 2 [video]","rec":4,"pts":1,"yrs":[2026,2026],"story":"49020885","q":{"t":"The LLM produces a probability distribution over the likelihood of all possible next tokens. So whatever the tokens are, \"ch\", \"ex\", etc. the next one gets a probability. During training, real life text is fed through the LLM, and rhe \"correct\" token is the one actually observed in the training text. Here's a recent video walkthrough in some detail, mostly aimed at providing a deeper understanding than \"next token predictor function\": https://youtu.be/GlYgs6v2YfU?is=IxVMhoCCE4N4WRVK (Start at 15:30 for the LLM specific parts)","by":"epistasis","id":"49569167"},"tags":["Math","Physics"],"learn":true,"s":5.4},{"id":"QgH9 ideo \"Why does light bend when it enters glass?\" several theories are explained which helped me understand the principals involved. https://www.youtube.com/watch?v=NLmpNM0sgYk Can anyone suggest a good explainer on light reflection at a similar level to the Fermilab ones?","by":"adolph","id":"29915663"},"tags":["Physics"],"learn":true,"s":4},{"id":"guTdrfycW2Q","title":"Statistical Rethinking 2022 Lecture 02 - Bayesian Inference","ch":"Richard McElreath","rec":2,"pts":0,"yrs":[2022,2023],"q":{"t":"So you have just one data point and you want to do statistics about it? No matter what you do, the results won't be useful. In Bayesian approach, you start with some distribution that is a wild guess and doesn't even need to base on any knowledge besides of the basics how money work and that unemployment cannot be 0% or 100%. Each data point will refine your distribution until at some dataset size, it will converge to something estimating the reality. You might want to watch an amazingly helpful introduction by Richard McElreath here https://www.youtube.com/watch?v=guTdrfycW2Q","by":"fridental","id":"36982671"},"tags":["AI"],"learn":true,"s":4},{"id":"GOw_I42eUpM","title":"Making denatonium benzoate - the world's most bitter chemical","ch":"NileRed","rec":2,"pts":0,"yrs":[2022,2023],"q":{"t":"NileRed did a video about this chemical. https://m.youtube.com/watch?v=GOw_I42eUpM","by":"NotYourLawyer","id":"34605227"},"tags":["Chemistry"],"learn":true,"s":4},{"id":"shEk8sz1oOw","title":"Fundamental Theorem of Algebra - Numberphile","ch":"Numberphile","rec":2,"pts":0,"yrs":[2022,2023],"tags":["Math"],"learn":true,"s":4},{"id":"ASQCa7mfjVo","title":"Extracting gold from computer parts (Part 1)","ch":"NileRed","rec":2,"pts":0,"yrs":[2022,2023],"q":{"t":"This is off topic, but I'm deeply curious what a plant to recycle lithium batteries looks like. I believe they'd be handling almost every form of matter, from solid lithium to liquid electolyte, the combustion gasses of bad batteries blowing up, and the plasma of the fire itself. Seems like a hell of a challenge and I'd love to hear all about it. (extracting gold is simpler, by comparison, and can be done at home by the sufficiently motivated- https://www.youtube.com/watch?v=ASQCa7mfjVo)","by":"droopyEyelids","id":"30767849"},"tags":["Chemistry"],"learn":true,"s":4},{"id":"yTeBUpR17Rw","title":"Negative Temperatures are HOT - Sixty Symbols","ch":"Sixty Symbols","rec":2,"pts":0,"yrs":[2022,2026],"q":{"t":"There is this famous video from 2013 https://www.youtube.com/watch?v=yTeBUpR17Rw","by":"krackers","id":"46597359"},"tags":["Physics"],"learn":true,"s":4},{"id":"351JCOvKcYw","title":"Are Black Holes Actually Fuzzballs?","ch":"PBS Space Time","rec":2,"pts":0,"yrs":[2022,2023],"q":{"t":"Black holes would be different if string theory is right. There would be no singularity, for instance, and no interior. String theory black holes (which are called fuzzballs) would emit slightly different gravitational waves when they merge. We should have sensitive enough gravitation wave detecters in the not too distant future to check this. There was a PBS Space Time episode on fuzzballs last November [1]. [1] https://www.youtube.com/watch?v=351JCOvKcYw","by":"tzs","id":"30911535"},"tags":["Physics"],"learn":true,"s":4},{"id":"L2idut9tkeQ","title":"Our Antimatter, Mirrored, Time-Reversed Universe","ch":"PBS Space Time","rec":2,"pts":0,"yrs":[2022,2023],"q":{"t":"Time could move backwards if we lived in a time symmetric universe. We don't. Maybe if you flipped the charge and handedness of the entire universe you could also reverse time, but that's yet to be tested. https://youtu.be/L2idut9tkeQ","by":"willis936","id":"35202878"},"tags":["Physics"],"learn":true,"s":4},{"id":"l7zS8Ld4_iA","title":"nbdev tutorial -- zero to published project in 90 minutes","ch":"Jeremy Howard","rec":2,"pts":0,"yrs":[2022,2023],"q":{"t":"Jupytext provides a system for version controlling notebooks, code reviewing them, and using them in the context of a larger Python project, without imposing any constraints on the larger project, because Jupytext saves notebooks as plain .py files. I ended up choosing Jupytext for a personal project because it seemed less complex than nbdev. (I never made it through the 90 minute nbdev introductory video: https://www.youtube.com/watch?v=l7zS8Ld4_iA). Are there advantages of nbdev over Jupytext that I'm missing out on?","by":"KerrickStaley","id":"36145719"},"tags":["AI"],"learn":true,"s":4},{"id":"SnFaRXeep5Y","title":"3. The Mayan Collapse - Ruins Among the Trees","ch":"Fall of Civilizations","rec":2,"pts":0,"yrs":[2022,2023],"q":{"t":"Maya's system of writing is very comprehensively destroyed and is completely unrecoverable. A plug here for the fantastic Fall of Civilizations podcast (https://fallofcivilizationspodcast.com/). It's Maya episode is incredibly riveting and informative (episode 3, https://www.youtube.com/watch?v=SnFaRXeep5Y) and goes at length into that exact destruction.","by":"danielodievich","id":"33052555"},"tags":["History"],"learn":true,"s":4},{"id":"b3NxrZOu_CE","title":"Hamming codes part 2: The one-line implementation","ch":"3Blue1Brown","rec":2,"pts":0,"yrs":[2022,2023],"q":{"t":"If you want to learn more about Hamming Codes from a mathematical perspective, I recommend 3Blue1Brown's YouTube series: > How to send a self-correcting message (Hamming codes) - https://youtu.be/X8jsijhllIA > Hamming codes part 2, the elegance of it all - https://youtu.be/b3NxrZOu_CE Associated with Ben Eater's video, if you want a perspective regarding low level computer hardware: > What is error correction? Hamming codes in hardware - https://youtu.be/h0jloehRKas","by":"WaffleIronMaker","id":"37110749"},"tags":["Math"],"learn":true,"s":4},{"id":"wdP_UDSsuro","title":"Is Interstellar Travel Impossible?","ch":"PBS Space Time","rec":2,"pts":0,"yrs":[2022,2024],"q":{"t":"> Of course there is no physics preventing it Physics arguably prevents this from being successful for journeys of any meaningful distance and carrying any meaningful payloads. PBS spacetime did a good video about this recently: https://www.youtube.com/watch?v=wdP_UDSsuro It's not impossible, but it's a lot harder than most people think.","by":"naasking","id":"33384191"},"tags":["Physics"],"learn":true,"s":4},{"id":"DvZnh7-nslo","title":"Can you solve THE Klein Bottle Rubik's cube?","ch":"Mathologer","rec":2,"pts":0,"yrs":[2022,2023],"q":{"t":"any particular favored geometry/dimension / number base? bagua, gigamix/magictile[1], kleine bottle[2], burmuda saturn cube, Szilassi polyhedron, pyraminx, skewb, 7D cube[3], tuttminx, hanoiminx, clover dodecahedron, icosahedron, turtle cube, sunminx, futtmix, 6 column ghost cube, 3 column ghost barrel, rubik's ball, unicorn cube, etc. [1] : https://www.youtube.com/watch?v=kN5_1vJbW9M [2] : https://www.youtube.com/watch?v=DvZnh7-nslo [3] : https://www.youtube.com/watch?v=13mB0YWSGPI","by":"sargstuff","id":"35331920"},"tags":["Math"],"learn":true,"s":4},{"id":"QHj9uVmwA_0","title":"Neural manifolds - The Geometry of Behaviour","ch":"Artem Kirsanov","rec":2,"pts":0,"yrs":[2022,2023],"q":{"t":"This reminds me of a video about how information is encoded in the brain: https://www.youtube.com/watch?v=QHj9uVmwA_0 Apparently, scientists a few years ago figured out how a mouse's brain encodes direction. They were able to predict the shape the encoding would take, and found it in the mouse's brain. They then were able to use their findings to determine which way the mouse was facing.","by":"juliangoldsmith","id":"34140388"},"tags":["Math","Biology"],"learn":true,"s":4},{"id":"CGhTQ4iruLc","title":"A Brief History of Humankind - Lesson 01 - part 1 - Dr. Yuval Noah Harari","ch":"Yuval Noah Harari ","rec":2,"pts":0,"yrs":[2023,2026],"q":{"t":"I enjoyed Yuval Harari's course A Brief History of Humankind when it was available on Coursera (it can still be found on youtube, although at low video quality — https://www.youtube.com/w ,"s":7.3},{"id":"Gi4ZZVS2GLA","title":"Introduction to Climate Modelling | Week 11 | MIT 18.S191 Fall 2020 | Henri Drake","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":46,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"Y68tnH0FIzc","title":"Nonlinear Climate Dynamics and Snowball Earth | Week 11 | MIT 18.S191 Fall 2020 | Henri Drake","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":47,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"a3V0BJLIo_c","title":"The diffusion equation | Week 12 | MIT 18.S191 Fall 2020 | Grant Sanderson","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":48,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"sbqPVPLHl5Q","title":"Stencils and Boundary Conditions | Week 12 | MIT 18S191 Fall 2020 | Alan Edelman","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":49,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"uf4g_U8Ok3c","title":"Evolution in time & space: 1D advection & diffusion | Week 12 | MIT 18S191 Fall 2020 | David Sanders","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":50,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"waOzCGDNPzk","title":"Ocean currents as two-dimensional advection diffusion | Week 12 | 18.S191 Fall 2020 | Henri Drake","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":51,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"WNpcJfw307Y","title":"Why you don't game on supercomputers | Week 13 | MIT 18.S191 Fall 2020 | James Schloss","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":52,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"kSbCYaB2KhQ","title":"Fluid dynamics with Oceananigans.jl | Week 13 | MIT 18.S191 Fall 2020 | Ali Ramadhan","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":53,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"GJFJXhgM0S4","title":"Building an ocean model from scratch | Week 13 | MIT 18.S191 Fall 2020 | Henri Drake","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":54,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"_LyXN5rAhZ8","title":"Generic programming | Week 13 | MIT 18.S191 Fall 2020 | David P. Sanders","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":55,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"mOJ0jABAhq4","title":"An overview of modern climate modeling | Week 13 | 18.S191 Fall 2020 | Henri Drake & James Schloss","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":56,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"g8RkArhtCc4","title":"What is a Discrete Fourier Transform? | Week 14 | MIT 18.S191 Fall 2020 | Grant Sanderson","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":57,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"oGZK3yGF-6k","title":"Matrix Calculus 2020 04 16 for MIT Linear Algebra 18.06 Spring 2020 (Alan Edelman)","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":58,"tags":["Math","Computer Science"],"learn":true,"s":7.3},{"id":"a-TMwV12Ca4","title":"Closing Remarks","ch":"The Julia Programming Language","course":"MIT 18.S191 Computational Thinking","part":59,"tags":["Math","Computer Science"],"learn":true,"s":7.3}];
const PICKS_PER_DAY = 6;
const byId = new Map(VIDEOS.map((v) => [v.id, v]));
const FOLLOWING = "Following";
const TOPIC_ORDER = [FOLLOWING, "LLMs", "AI", "Math", "Physics", "Chemistry", "Biology", "Computer Science", "Robotics", "History", "Japanese", "Mandarin", "Korean"];
const inTopic = (v, t) => !t || (t === FOLLOWING ? !!v.follow : v.tags.includes(t));

// Per-viewer state, browser-only. Everything still works if storage is blocked.
const KEY = "depthfeed.v1";
let state = { saved: [], watched: [], hidden: [], tagAffinity: {}, topic: null, reshuffles: 0, day: "" };
try { Object.assign(state, JSON.parse(localStorage.getItem(KEY)) || {}); } catch {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch {} };

const today = new Date().toISOString().slice(0, 10);
if (state.day !== today) { state.day = today; state.reshuffles = 0; save(); }

// Seeded RNG so "Today" is the same set all day unless you deliberately ask for more.
function rng(seed) {
  let h = 2166136261;
  for (const c of seed) h = Math.imul(h ^ c.charCodeAt(0), 16777619);
  return () => ((h = Math.imul(h ^ (h >>> 15), 2246822507), h = Math.imul(h ^ (h >>> 13), 3266489909), (h ^= h >>> 16) >>> 0) / 4294967296);
}

function affinity(v) {
  return v.tags.reduce((a, t) => a + (state.tagAffinity[t] || 0), 0);
}
function nudge(v, d) {
  for (const t of v.tags) state.tagAffinity[t] = Math.max(-5, Math.min(5, (state.tagAffinity[t] || 0) + d));
}

function picks() {
  const excluded = new Set([...state.watched, ...state.hidden, ...state.saved]);
  const pool = VIDEOS.filter((v) => !excluded.has(v.id) && inTopic(v, state.topic));
  const rand = rng(`${today}:${state.reshuffles}:${state.topic}`);
  // Weighted sampling without replacement (Efraimidis-Spirakis): key = u^(1/w).
  return pool
    .map((v) => ({ v, k: Math.pow(rand(), 1 / (v.s * Math.exp(0.35 * affinity(v)))) }))
    .sort((a, b) => b.k - a.k)
    .slice(0, PICKS_PER_DAY)
    .map((x) => x.v);
}

const esc = (s = "") => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const span = (v) => (v.yrs[0] === v.yrs[1] ? `${v.yrs[0]}` : `${v.yrs[0]}–${v.yrs[1]}`);
const why = (v) => v.course && !v.rec ? `${v.course} · lecture ${v.part}` : (v.follow || v.lang) && !v.rec ? `${v.lang ? v.lab || "Language channel" : "You follow this channel"}${v.pub ? ` · ${v.pub}` : ""}` : [v.rec ? `${v.rec} HN ${v.rec === 1 ? "person" : "people"} linked it` : "", v.pts ? `${v.pts} points` : "", span(v)].filter(Boolean).join(" · ");

function card(v) {
  const isSaved = state.saved.includes(v.id);
  return `<article class="card" data-id="${v.id}">
    <button class="thumb" data-act="watch" aria-label="Watch ${esc(v.title)}" style="background-image:url(https://i.ytimg.com/vi/${v.id}/hq2.jpg)"></button>
    <div class="body">
      <div class="title" data-act="watch">${esc(v.title)}</div>
      <div class="meta">${v.learn ? "<b>Learning</b> · " : ""}${esc(v.ch)} · ${why(v)}</div>
      ${v.q ? `<p class="quote">${esc(v.q.t)}</p>` : ""}
      <div class="actions">
        <button class="btn primary" data-act="watch">Watch</button>
        <button class="btn" data-act="save">${isSaved ? "Unsave" : "Save for later"}</button>
        <button class="btn" data-act="hide">Not for me</button>
      </div>
    </div>
  </article>`;
}

const grid = (list, empty) => (list.length ? `<div class="grid">${list.map(card).join("")}</div>` : `<p class="empty">${empty}</p>`);
let tab = "picks";
let query = "";

function render() {
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-pressed", b.dataset.tab === tab));
  const counts = {};
  VIDEOS.forEach((v) => [...v.tags, ...(v.follow ? [FOLLOWING] : [])].forEach((t) => (counts[t] = (counts[t] || 0) + 1)));
  document.getElementById("topics").innerHTML =
    `<button class="chip" data-topic="" aria-pressed="${!state.topic}">All</button>` +
    TOPIC_ORDER.filter((t) => counts[t])
      .map((t) => `<button class="chip" data-topic="${t}" aria-pressed="${state.topic === t}">${t} <span class="meta">${counts[t]}</span></button>`).join("");

  const view = document.getElementById("view");
  const topicOk = (v) => inTopic(v, state.topic);
  if (tab === "picks") {
    view.innerHTML = `<p class="note">${PICKS_PER_DAY} picks for ${today}. They stay the same all day, so there is nothing to refresh.</p>` +
      grid(picks(), "Nothing left in this topic. Try another.") +
      `<button class="btn more" id="reshuffle">I've seen these, show ${PICKS_PER_DAY} different ones</button>`;
  } else if (tab === "search") {
    const q = query.toLowerCase();
    const hits = q.length < 2 ? [] : VIDEOS.filter((v) => topicOk(v) && `${v.title} ${v.ch} ${v.hn || ""}`.toLowerCase().includes(q)).slice(0, 30);
    view.innerHTML = `<input type="search" id="q" placeholder="Search ${VIDEOS.length.toLocaleString()} videos by title or channel" value="${esc(query)}" autofocus>` +
      grid(hits, q.length < 2 ? "Type at least two letters." : "No matches.");
    const input = document.getElementById("q");
    input.focus(); input.setSelectionRange(query.length, query.length);
    input.oninput = (e) => { query = e.target.value; render(); };
  } else {
    const ids = tab === "saved" ? state.saved : state.watched;
    view.innerHTML = grid([...ids].reverse().map((id) => byId.get(id)).filter(Boolean).filter(topicOk),
      tab === "saved" ? "Nothing saved yet." : "Nothing watched yet.");
  }
}

const toggle = (list, id) => (list.includes(id) ? list.filter((x) => x !== id) : [...list, id]);
let playing = null;

function openPlayer(v) {
  playing = v;
  document.getElementById("p-title").textContent = v.title;
  // nocookie domain, no related videos from other channels, no annotations.
  document.getElementById("p-frame").src = `https://www.youtube-nocookie.com/embed/${v.id}?autoplay=1&rel=0&iv_load_policy=3&playsinline=1`;
  document.getElementById("p-info").innerHTML =
    `<p class="meta" style="margin-top:12px">${esc(v.ch)} · ${why(v)}` +
    (v.story ? ` · <a href="https://news.ycombinator.com/item?id=${v.story}" target="_blank" rel="noopener">HN discussion</a>` : "") + `</p>` +
    (v.q ? `<p class="quote">${esc(v.q.t)} <a href="https://news.ycombinator.com/item?id=${v.q.id}" target="_blank" rel="noopener">— ${esc(v.q.by)}</a></p>` : "");
  document.getElementById("player").classList.add("open");
  document.body.style.overflow = "hidden";
}
function closePlayer(markWatched) {
  if (playing && markWatched && !state.watched.includes(playing.id)) {
    state.watched.push(playing.id);
    state.saved = state.saved.filter((x) => x !== playing.id);
    nudge(playing, 1);
    save();
  }
  playing = null;
  document.getElementById("p-frame").src = "about:blank";
  document.getElementById("player").classList.remove("open");
  document.body.style.overflow = "";
  render();
}

const themeSel = document.getElementById("theme");
themeSel.value = document.documentElement.dataset.theme || "system";
themeSel.onchange = () => {
  const t = themeSel.value;
  if (t === "system") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = t;
  try { localStorage.setItem("depthfeed.theme", t); } catch {}
};

document.getElementById("p-done").onclick = () => closePlayer(true);
document.getElementById("p-close").onclick = () => closePlayer(false);
document.addEventListener("keydown", (e) => { if (e.key === "Escape" && playing) closePlayer(false); });

document.addEventListener("click", (e) => {
  const tabBtn = e.target.closest("#tabs button");
  if (tabBtn) { tab = tabBtn.dataset.tab; render(); return; }
  const chip = e.target.closest("[data-topic]");
  if (chip) { state.topic = chip.dataset.topic || null; save(); render(); return; }
  if (e.target.id === "reshuffle") { state.reshuffles++; save(); render(); window.scrollTo(0, 0); return; }
  const act = e.target.closest("[data-act]");
  if (!act) return;
  const v = byId.get(act.closest(".card").dataset.id);
  if (act.dataset.act === "watch") openPlayer(v);
  if (act.dataset.act === "save") { state.saved = toggle(state.saved, v.id); if (state.saved.includes(v.id)) nudge(v, 1); save(); render(); }
  if (act.dataset.act === "hide") { state.hidden.push(v.id); nudge(v, -1); save(); render(); }
});

render();
</script>
